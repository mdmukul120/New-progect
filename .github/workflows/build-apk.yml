name: Build NovaCut Android APK

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'app/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore novacut-release.jks \
            -alias novacut \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass novacut-ci -keypass novacut-ci \
            -dname "CN=NovaCut, OU=App, O=NovaCut, L=Dhaka, C=BD"

      - name: Build signed release APK
        working-directory: android
        env:
          NOVACUT_STORE_FILE: ${{ github.workspace }}/novacut-release.jks
          NOVACUT_STORE_PASS: novacut-ci
          NOVACUT_KEY_ALIAS: novacut
          NOVACUT_KEY_PASS: novacut-ci
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::Gradle build failed (exit $code). Last 40 log lines:"
            tail -40 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NovaCut-v1.0.apk
          ls -lh NovaCut-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCut-APK
          path: NovaCut-v1.0.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: NovaCut v1.0
          files: NovaCut-v1.0.apk
          body: |
            NovaCut — Premium Video Editor (Android APK)

            ফাইলটি ডাউনলোড করে ফোনে ইনস্টল করুন (Unknown sources অনুমতি দিন)।
            Download the APK and install it on your phone (allow "Install unknown apps").
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
